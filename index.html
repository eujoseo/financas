<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Finanças do José</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: livro-caixa digital — cabeçalho fixo com abas, conteúdo em grade que vira uma coluna no celular.
   Cor: tinta verde-petróleo da cédula de R$ 100 sobre papel levemente esverdeado. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#eaf0ee; --ink:#11201c; --ink-2:#4a5a55; --muted:#7b8984;
  --line:#dbe3e0; --line-2:#c5d0cc; --accent:#0f5c63; --accent-ink:#ffffff; --accent-wash:#e1eff0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#006b2e; --good-wash:#e3f3e8; --warn:#8a5d00; --warn-wash:#fdf1d6; --bad:#c42f2f; --bad-wash:#fbe4e2;
  --prev:#7b8984; --today:#fff6d9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1312; --surface:#141c1a; --surface-2:#1b2523; --ink:#e6eeeb; --ink-2:#b2c0bb; --muted:#84948f;
  --line:#24302d; --line-2:#32403c; --accent:#5cb8bd; --accent-ink:#06201f; --accent-wash:#16312f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#3cc56a; --good-wash:#12291b; --warn:#f2b632; --warn-wash:#2c2410; --bad:#ef6b6b; --bad-wash:#311616;
  --prev:#84948f; --today:#2a2612; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1312; --surface:#141c1a; --surface-2:#1b2523; --ink:#e6eeeb; --ink-2:#b2c0bb; --muted:#84948f;
  --line:#24302d; --line-2:#32403c; --accent:#5cb8bd; --accent-ink:#06201f; --accent-wash:#16312f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#3cc56a; --good-wash:#12291b; --warn:#f2b632; --warn-wash:#2c2410; --bad:#ef6b6b; --bad-wash:#311616;
  --prev:#84948f; --today:#2a2612; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
@media (max-width:520px){.brand{width:100%}.brand .seal{display:none}.mode{margin-right:auto}.hello{font-size:19px}}
.brand h1{font-size:20px}
.brand .seal{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mode{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.ok i{background:var(--good)} .mode.local i{background:var(--accent)} .mode.warn i{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;width:100%;margin-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 12px 11px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,tr[tabindex]:focus-visible,.cell-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:20px 60px}
.view{display:grid;gap:18px}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2,.grid-main{grid-template-columns:minmax(0,1fr)}}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.chip{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select,input[type=text],input[type=date],input[type=month],input[type=number],input[type=search]{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}

/* month nav */
.mnav{display:flex;align-items:center;gap:6px}
.mnav h2{font-size:22px;min-width:9.5ch;text-align:center;text-transform:capitalize}
.mnav .btn{padding:6px 10px}

/* hero + tiles */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.25fr);gap:0;padding:0;overflow:hidden}
.hero > div{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.hero > div:first-child{border-left:0}
.hero > div:last-child{background:var(--accent-wash)}
.hero .big{font-family:var(--f-display);font-size:clamp(30px,4.2vw,46px);font-weight:700;line-height:1.05;margin:6px 0 4px;letter-spacing:-.02em}
.hero .val{font-family:var(--f-display);font-size:24px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em}
@media (max-width:860px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}.hero > div{border-top:1px solid var(--line)}.hero > div:nth-child(-n+2){border-top:0}.hero > div:nth-child(3),.hero > div:nth-child(4){grid-column:1/-1;border-left:0}}
.delta{font-size:12.5px;font-weight:500}
.up{color:var(--good)} .down{color:var(--bad)}

/* banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--r);padding:12px 14px}
.banner b{color:var(--ink)}
.banner .ic{font-weight:700;color:var(--warn);margin-right:6px}

/* meters */
.meter{display:grid;gap:4px}
.meter .bar{height:8px;border-radius:4px;background:var(--accent-wash);overflow:hidden}
.meter .bar > span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter.over .bar > span{background:var(--bad)}
.meter.near .bar > span{background:var(--warn)}
.meters{display:grid;gap:12px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.strip > div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.strip > div:first-child{border-left:0}
.strip .v{font-family:var(--f-num);font-size:15px;font-weight:500;margin-top:3px;white-space:nowrap;overflow-wrap:anywhere}
.strip .p{font-size:11.5px;color:var(--prev)}
@media (max-width:860px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip > div:nth-child(4){border-left:0}.strip > div:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:460px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip > div{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}.strip > div:nth-child(odd){border-left:0!important}.strip > div:nth-child(-n+2){border-top:0}}

/* the cédula (day grid) */
.ledger-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.ledger{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.8px}
.ledger th{font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line-2);background:var(--surface-2);position:sticky;top:0}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr:hover td{background:var(--surface-2)}
.ledger tr.sel td{background:var(--accent-wash)!important}
.ledger tr.today td{background:var(--today)}
.ledger tr.today td:first-child{font-weight:600}
.ledger tr.today td:first-child::after{content:" hoje";font-family:var(--f-body);font-size:10.5px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ledger tr.wk td:first-child{color:var(--muted)}
.ledger .wd{color:var(--muted);font-size:11px;margin-left:4px}
.ledger .z{color:var(--line-2)}
.ledger .pv{color:var(--prev);font-style:italic}
.ledger .pv-add{display:block;font-size:10.5px;color:var(--prev);font-style:italic}
@media (max-width:520px){.ledger{font-size:11.5px}.ledger td,.ledger th{padding:5px 5px}.ledger th{font-size:9.5px;letter-spacing:.03em}.ledger .wd{display:none}.ledger .pv-add{font-size:9.5px}.ledger tr.today td:first-child::after{content:" •"}}
.ledger tfoot td{font-weight:500;border-top:1px solid var(--line-2);border-bottom:0;background:var(--surface-2);padding:8px 10px}
.saldo{font-weight:500}
.s-bom{color:var(--good)} .s-ok{color:var(--ink)} .s-alerta{color:var(--warn)} .s-neg{color:var(--bad)}
.s-crit{color:var(--bad);background:var(--bad-wash)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.l{height:2px;width:14px;border-radius:1px}

/* item lists */
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .d{font-weight:500;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted)}
.item .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.item.prev .d,.item.prev .v{color:var(--prev);font-style:italic}
.item.click{cursor:pointer}
.item.click:hover{background:var(--surface-2)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);margin-right:6px;font-style:normal}
.tag.entrada{background:color-mix(in srgb,var(--s1) 14%,transparent);color:var(--ink)}
.tag.saida{background:color-mix(in srgb,var(--s2) 16%,transparent);color:var(--ink)}
.tag.diario{background:var(--warn-wash);color:var(--ink)}
.tag.invest{background:var(--good-wash);color:var(--ink)}
.tag.prev{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.v.entrada{color:var(--good)}
.empty{padding:22px 4px;color:var(--muted);text-align:center}

/* data tables */
.tbl-wrap{overflow-x:auto}
.tbl{font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.grp td{font-weight:600;background:var(--surface-2)}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--line-2)}
.tbl tr.pv td{color:var(--prev);font-style:italic}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl input.cell{width:118px;text-align:right;font-family:var(--f-num);padding:4px 6px}
.tbl td.inh{color:var(--muted)}
.tbl th.cur,.tbl td.cur{background:var(--accent-wash)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;font-family:var(--f-body);font-style:normal}
.pill.good{background:var(--good-wash);color:var(--good)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.warn{background:var(--warn-wash);color:var(--warn)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .bar{transition:opacity .15s}
.chart .bar:hover{opacity:.8}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-width:140px;max-width:260px}
.tip .t{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r b{font-family:var(--f-num);font-weight:500}
.tip .k{display:inline-block;width:12px;height:2px;border-radius:1px;margin-right:6px;vertical-align:middle}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:12px}
.hbar .track span{display:block;height:100%;max-width:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.hbar .val{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);white-space:nowrap}

/* fab, dialog, toast */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:13px 20px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
dialog{border:1px solid var(--line-2);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(5,15,13,.45)}
dialog form{display:grid;gap:14px;padding:18px}
dialog h3{font-size:18px}
.fld{display:grid;gap:5px}
.fld > span{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select{width:100%}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg label{text-align:center;padding:8px 4px;cursor:pointer;font-size:13px;font-weight:500;border-left:1px solid var(--line-2)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:-3px}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-acts .btn.danger{margin-right:auto}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;max-width:calc(100vw - 32px)}
.wz{max-width:780px;margin:0 auto;display:grid;gap:16px}
.wz-prog{display:flex;gap:4px}
.wz-prog span{flex:1;display:grid;gap:5px;min-width:0}
.wz-prog i{height:4px;border-radius:2px;background:var(--line)}
.wz-prog span.done i{background:var(--accent)} .wz-prog span.cur i{background:var(--accent);opacity:.55}
.wz-prog em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz-prog span.cur em{color:var(--ink);font-weight:600}
@media (max-width:620px){.wz-prog em{display:none}.wz-prog span.cur em{display:block;position:absolute;opacity:0}}
.wz-card{display:grid;gap:12px;padding:20px}
.wz-card p{margin:0}
.wz-h{font-size:22px}
.wz-sub{font-size:15px;margin-top:6px}
.wz-list{margin:0;padding-left:20px;display:grid;gap:6px}
.wz-tip{background:var(--accent-wash);border-radius:8px;padding:10px 12px;font-size:13px}
.wz-rows{display:grid;gap:8px}
.wz-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.wz-f{flex:1 1 110px;min-width:0}
.wz-f.wide{flex:3 1 220px}
.wz-f input,.wz-f select{width:100%}
.wz-del{flex:0 0 auto}
.wz-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;flex-wrap:wrap}
.ledger tr.before td{color:var(--line-2);cursor:default}

/* cabeçalho com saudação + tema */
.hello{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.hsub{font-size:12.5px;color:var(--muted);margin-top:2px}
.theme{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;gap:2px;background:var(--surface)}
.theme button{appearance:none;border:0;background:none;border-radius:999px;padding:4px 9px;cursor:pointer;font-size:13px;line-height:1;color:var(--ink-2)}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.theme button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* cartões de crédito */

<script>
(() => {
"use strict";
/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, "0");
const r2 = v => Math.round((+v || 0) * 100) / 100;
const sum = a => r2(a.reduce((s, x) => s + (+x || 0), 0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const F = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const FN = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const FC = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
const brl = v => F.format(+v || 0);
const num = v => FN.format(+v || 0);
const pct = v => v == null || !isFinite(v) ? "–" : (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESA = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DSEM = ["dom","seg","ter","qua","qui","sex","sáb"];
const TIPOS = { entrada: "Entrada", saida: "Saída", diario: "Diário", invest: "Investimento" };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const curYm = () => today().slice(0, 7);
const ymAdd = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const dim = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${MES[m - 1]} ${y}`; };
const ymShort = ym => { const [y, m] = ym.split("-").map(Number); return `${MESA[m - 1]}/${String(y).slice(2)}`; };
const dLabel = ds => { const [y, m, d] = ds.split("-").map(Number); return `${pad(d)}/${pad(m)}`; };
const wday = ds => { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m - 1, d).getDay(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseMoney = s => {
  s = String(s ?? "").trim().replace(/[R$\s]/g, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return r2(parseFloat(s));
};
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };

/* ───────── state ───────── */
// Categorias-base, a partir das do modelo original (Moradia/Apartamento, Saúde, Viagem, Trabalho, Seguro, Telefone, Estudos, Alimentação, Serviços…).
const BASE_CATS = {
  entrada: ["Salário", "Honorários", "Auxílio família", "Reembolso", "Rendimentos", "Presente", "Vendas", "Ajustes", "Outras entradas"],
  saida: ["Moradia", "Casa", "Contas da casa", "Cartão de crédito", "Alimentação", "Saúde", "Esporte", "Trabalho", "Estudos", "Seguro", "Telefone", "Transporte", "Assinaturas", "Serviços", "Viagem", "Lazer", "Vestuário", "Cuidados pessoais", "Presentes", "Doações", "Impostos e taxas", "Ajustes", "Outros"],
  diario: ["Lanches", "Mercado", "Alimentação", "Saúde", "Farmácia", "Barbearia", "Gasolina", "Transporte", "Lazer", "Outros"],
  invest: ["Reserva de emergência", "Investimentos", "Metas", "Amortização do financiamento", "Previdência", "Tesouro Direto", "Renda variável"]
};
const DEFAULT_CONFIG = () => ({
  versao: 1,
  saldoInicial: { mes: curYm(), valor: 0 },
  inicioPrevisao: curYm(),
  metaEconomia: 0.3,
  faixas: { bom: 2000, ok: 1000, alerta: -500 },
  categorias: JSON.parse(JSON.stringify(BASE_CATS)),
  catVersao: 2,
  alertaDiario: 0.8,
  cartoes: [],
  orcDiario: [],
  recorrentes: []
});
const DEFAULT_PAT = () => ({ contas: [], valores: {} });
const S = { config: null, meses: {}, patrimonio: null, ready: false };
const UI = { tab: "geral", ym: curYm(), day: null, lancYm: curYm(), lancTipo: "", lancQ: "", ecoYear: +curYm().slice(0, 4), patYm: curYm(), patUnlock: false, mesView: "mes", anoY: +curYm().slice(0, 4), casaYm: null, finExtra: 0, finLump: 0, card: null, cardYm: null, catYm: null };
try { const t = lsGet("fj-ui-tab"); if (t) UI.tab = t; } catch {}

/* ───────── storage: Claude db when available, browser otherwise ───────── */
const LS_KEY = "financas-jose-v1";
const Store = {
  mode: "loading", db: null, dl: null, queues: {}, hasData: false,
  async init() {
    let db = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { db = await window.claude.use("db"); } catch { db = null; }
      try { this.dl = await window.claude.use("downloads"); } catch { this.dl = null; }
    }
    if (db) { this.db = db; this.mode = "claude"; this.subscribe(); }
    else this.initLocal();
  },
  initLocal() {
    this.mode = "local";

function niceTicks(min, max, count = 4) {

/* ───────── gráficos extras ───────── */
const PAL = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
function barPathDown(x, y, w, h, r = 4) { if (h <= 0) return ""; r = Math.min(r, h, w / 2); return `M${x} ${y}V${y + h - r}Q${x} ${y + h} ${x + r} ${y + h}H${x + w - r}Q${x + w} ${y + h} ${x + w} ${y + h - r}V${y}Z`; }
// Colunas empilhadas: valores positivos sobem, negativos descem do zero; linha opcional por cima. 2px de espaço entre segmentos.
function stackedColumns(host, { labels, series, faded = [], height = 250, tipTitle = l => l, line = null }) {
  const W = Math.max(host.clientWidth || 600, 280), H = height, L = 50, R = 10, T = 14, B = 26, n = labels.length;
  if (!n) { host.innerHTML = `<div class="empty">Sem dados ainda.</div>`; return; }
  const pos = labels.map((_, i) => sum(series.map(se => Math.max(0, se.values[i] || 0)))), neg = labels.map((_, i) => sum(series.map(se => Math.min(0, se.values[i] || 0))));
  const all = [...pos, ...neg, 0, ...(line ? line.values.filter(v => v != null) : [])];
  const ticks = niceTicks(Math.min(...all), Math.max(...all, 1), 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
  const band = (W - L - R) / n, bw = Math.min(28, band * 0.62), cx = i => L + i * band + band / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img"><g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>`;
  s += ticks.map(t => `<text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${axisFmt(t)}</text>`).join("");
  labels.forEach((lab, i) => {
    const x = cx(i) - bw / 2, op = faded[i] ? .45 : 1;
    const up = series.map((se, j) => ({ j, v: se.values[i] || 0 })).filter(o => o.v > 0), dn = series.map((se, j) => ({ j, v: se.values[i] || 0 })).filter(o => o.v < 0);
    let acc = 0;
    up.forEach((o, k) => { const yTop = Y(acc + o.v), yBot = Y(acc) - (k ? 2 : 0), h = Math.max(0, yBot - yTop); s += k === up.length - 1 ? `<path d="${barPath(x, yTop, bw, h)}" fill="${series[o.j].color}" fill-opacity="${op}"/>` : `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${series[o.j].color}" fill-opacity="${op}"/>`; acc += o.v; });
    acc = 0;
    dn.forEach((o, k) => { const yTop = Y(acc) + (k ? 2 : 0), yBot = Y(acc + o.v), h = Math.max(0, yBot - yTop); s += k === dn.length - 1 ? `<path d="${barPathDown(x, yTop, bw, h)}" fill="${series[o.j].color}" fill-opacity="${op}"/>` : `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${series[o.j].color}" fill-opacity="${op}"/>`; acc += o.v; });
    if (n <= 14 || i % Math.ceil(n / 12) === 0) s += `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  s += `<line class="base" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if (line) {
    let d = ""; line.values.forEach((v, i) => { if (v == null) return; d += (d ? "L" : "M") + cx(i).toFixed(1) + " " + Y(v).toFixed(1); });
    s += `<path d="${d}" fill="none" stroke="${line.color}" stroke-width="2" stroke-linejoin="round"/>` + line.values.map((v, i) => v == null ? "" : `<circle cx="${cx(i)}" cy="${Y(v)}" r="3.5" fill="${line.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");
  }
  labels.forEach((_, i) => { s += `<rect class="hit" data-i="${i}" x="${L + i * band}" y="${T}" width="${band}" height="${H - T - B}" style="cursor:default"/>`; });
  host.innerHTML = s + "</svg>";
  host.querySelectorAll(".hit").forEach(h => {
    h.addEventListener("pointermove", e => { const i = +h.dataset.i; const rows = series.filter(se => se.values[i]).map(se => `<div class="r"><span><span class="k" style="background:${se.color};height:8px;width:8px;border-radius:2px"></span>${esc(se.name)}</span><b>${brl(se.values[i])}</b></div>`).join("");
      showTip(e, `<div class="t">${esc(tipTitle(labels[i], i))}${faded[i] ? " · inclui previsão" : ""}</div>${rows || '<div class="r muted">sem valores</div>'}${line && line.values[i] != null ? `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span><span class="k" style="background:${line.color}"></span>${esc(line.name)}</span><b>${brl(line.values[i])}</b></div>` : `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Total</span><b>${brl(pos[i] + neg[i])}</b></div>`}`); });
    h.addEventListener("pointerleave", hideTip);
  });
}
// Várias linhas no mesmo eixo, com cursor que mostra todas no ponto.
function lineMulti(host, { labels, series, height = 230, fmtX = l => l, xTicks = null }) {
  const W = Math.max(host.clientWidth || 600, 280), H = height, L = 50, R = 14, T = 12, B = 26, n = labels.length;
  const all = series.flatMap(se => se.values.filter(v => v != null)).concat([0]);
  const ticks = niceTicks(Math.min(...all), Math.max(...all, 1), 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1)), Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
  const xt = xTicks || labels.map((_, i) => i).filter(i => n <= 12 || i % Math.ceil(n / 8) === 0);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img"><g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>`;
  s += ticks.map(t => `<text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${axisFmt(t)}</text>`).join("");
  s += xt.map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(fmtX(labels[i], i))}</text>`).join("");
  series.forEach(se => { let d = ""; se.values.forEach((v, i) => { if (v == null) return; d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); }); s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" ${se.dash ? 'stroke-dasharray="5 4"' : ""}/>`; });
  s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--line-2)" visibility="hidden"/><rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></svg>`;
  host.innerHTML = s;
  const svg = host.querySelector("svg"), xh = svg.querySelector(".xh");
  svg.querySelector(".hit").addEventListener("pointermove", e => {
    const rc = svg.getBoundingClientRect(), px = (e.clientX - rc.left) * W / rc.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - L) / ((W - L - R) / Math.max(n - 1, 1)))));
    xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("visibility", "visible");
    showTip(e, `<div class="t">${esc(fmtX(labels[i], i, true))}</div>` + series.map(se => `<div class="r"><span><span class="k" style="background:${se.color}"></span>${esc(se.name)}</span><b>${se.values[i] == null ? "quitado" : brl(se.values[i])}</b></div>`).join(""));
  });
  svg.querySelector(".hit").addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
}
function sparkline(vals, color = "var(--accent)") {
  const v = vals.map(x => x == null ? null : +x), ok = v.filter(x => x != null);
  if (ok.length < 2) return `<svg class="spark" viewBox="0 0 90 26" aria-hidden="true"></svg>`;
  const mn = Math.min(...ok), mx = Math.max(...ok), X = i => 2 + i * 86 / (v.length - 1), Y = x => 22 - (mx === mn ? 9 : (x - mn) / (mx - mn) * 18);
  let d = ""; v.forEach((x, i) => { if (x == null) return; d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(x).toFixed(1); });
  const li = v.map((x, i) => x == null ? -1 : i).filter(i => i >= 0).pop();
  return `<svg class="spark" viewBox="0 0 90 26" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(li)}" cy="${Y(v[li])}" r="3" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
}
function compBar(items) {

/* ───────── financiamento ───────── */
const fin = () => cfg().financ || null;
function finSaldo() { const f = fin(); if (!f) return 0; if (f.contaId && (S.patrimonio?.contas || []).some(c => c.id === f.contaId)) return patVal(curYm(), f.contaId).v; return +f.saldo || 0; }
const finPrazo = () => { const f = fin(); return f ? Math.max(1, (+f.prazo || 1) - Math.max(0, monthsBetween(f.prazoDe || curYm(), curYm()))) : 1; };
const finTaxaM = aa => Math.pow(1 + (+aa || 0) / 100, 1 / 12) - 1;
// Projeção do saldo devedor (SAC ou Price), com amortização extra mensal e/ou um valor único agora (sempre reduzindo prazo).
function finSim(S0, P, aa, sist, extra = 0, lump = 0) {
  const i = finTaxaM(aa); let Sd = Math.max(0, S0 - lump), m = 0, juros = 0, first = null; const pts = [r2(Sd)];
  if (Sd <= 0.005) return { meses: 0, juros: 0, pts, parcela: 0 };
  const pmt = sist === "PRICE" ? (i > 0 ? S0 * i / (1 - Math.pow(1 + i, -P)) : S0 / P) : 0, A = S0 / P;
  while (Sd > 0.005 && m < 720) {
    const j = Sd * i, base = sist === "PRICE" ? pmt - j : A;
    let a = base + extra; if (a > Sd) a = Sd;
    if (first == null) first = sist === "PRICE" ? pmt : A + j;
    Sd -= a; juros += j; m++; pts.push(r2(Math.max(0, Sd)));
  }
  return { meses: m, juros: r2(juros), pts, parcela: r2(first || 0) };
}

    <label class="fld"><span>Saldo devedor vem de</span><select id="fConta"><option value="">Informar aqui manualmente</option>${dividas.map(x => `<option value="${esc(x.id)}" ${x.id === guessConta ? "selected" : ""}>Patrimônio › ${esc(x.nome)} (${brl(patVal(curYm(), x.id).v)})</option>`).join("")}</select></label>
    <label class="fld" id="fSaldoBox"><span>Saldo devedor hoje (R$)</span><input type="text" inputmode="decimal" id="fSaldo" value="${f.saldo ? num(f.saldo) : ""}" placeholder="188.000,00"></label>

      <label class="fld"><span>Sistema</span><select id="fSist"><option value="SAC" ${f.sist !== "PRICE" ? "selected" : ""}>SAC (parcela cai com o tempo)</option><option value="PRICE" ${f.sist === "PRICE" ? "selected" : ""}>Price (parcela fixa)</option></select></label></div>

function openAmortDlg() {

  openDlg(`<h3>💪 Registrar amortização</h3>
    <div class="fld-row"><label class="fld"><span>Valor amortizado (R$)</span><input type="text" inputmode="decimal" id="aV" placeholder="0,00" autofocus></label>

/* ───────── custo de vida e reserva ───────── */
function custoMensal(ym) {
  const ativo = r => r.t === "saida" && (r.inicio || "") <= ym && (!r.fim || ym <= r.fim);
  const recs = (cfg().recorrentes || []).filter(ativo);
  const apt = sum(recs.filter(isCasa).map(r => cardOf(r.pag) ? +r.v : prevValue(r, ym)));
  const card = sum(recs.filter(r => !isCasa(r) && cardOf(r.pag)).map(r => +r.v));
  const outros = sum(recs.filter(r => !isCasa(r) && !cardOf(r.pag)).map(r => prevValue(r, ym)));
  const dia = orcMes();
  return { ym, apt, card, outros, dia, total: r2(apt + card + outros + dia) };
}
// mês "típico" à frente: o mais caro entre este e os próximos 2 (pega a mudança para o apartamento, por exemplo)
const custoTipico = () => [0, 1, 2].map(k => custoMensal(ymAdd(curYm(), k))).sort((a, b) => b.total - a.total)[0];
function reservaInfo() {
  const lp = patLastOwn(), reserva = lp ? patTot(lp > curYm() ? curYm() : lp).reserva : 0, c = custoTipico();
  const meses = c.total ? reserva / c.total : null;
  const nivel = meses == null ? ["", "–"] : meses >= 6 ? ["good", "✓ protegido"] : meses >= 3 ? ["warn", "atenção"] : ["bad", "baixa"];
  return { reserva, custo: c, meses, nivel, alvo6: r2(c.total * 6), falta6: r2(Math.max(0, c.total * 6 - reserva)) };
}
function reservaHtml(compact) {

  return `<section class="card"><div class="spread"><h2>🛟 Reserva de emergência</h2>${R.meses != null ? `<span class="pill ${R.nivel[0]}">${R.nivel[1]}</span>` : ""}</div>
    <p class="sub">Quantos meses do seu custo de vida a reserva aguenta. O ideal é 6 meses ou mais.</p>
    <div class="res-big">${R.meses == null ? "–" : R.meses.toLocaleString("pt-BR", { maximumFractionDigits: 1 })} <small>${R.meses != null && R.meses < 2 && R.meses >= 1 ? "mês" : "meses"}</small></div>
    <div class="meter ${R.meses != null && R.meses < 3 ? "over" : R.meses != null && R.meses < 6 ? "near" : ""}"><div class="bar res-bar"><span style="width:${w.toFixed(1)}%"></span></div>
      <div class="spread small muted"><span>${brl(R.reserva)} guardados</span><span>meta de 6 meses: ${brl(R.alvo6)}</span></div></div>
    ${R.falta6 > 0 && R.meses != null ? `<p class="small" style="margin:8px 0 0">Faltam <b>${brl(R.falta6)}</b> para os 6 meses.</p>` : ""}
    ${compact ? "" : `<div class="items" style="margin-top:8px">
      <div class="item"><div><div class="d">Custo de vida por mês</div><div class="m">mês considerado: ${ymLabel(c.ym)}</div></div><div class="v"><b>${num(c.total)}</b></div></div>
      ${c.apt ? `<div class="item"><div><div class="d">🏢 Apartamento</div></div><div class="v">${num(c.apt)}</div></div>` : ""}
      ${c.outros ? `<div class="item"><div><div class="d">Contas fixas</div></div><div class="v">${num(c.outros)}</div></div>` : ""}
      ${c.card ? `<div class="item"><div><div class="d">💳 Fixos no cartão</div></div><div class="v">${num(c.card)}</div></div>` : ""}
      ${c.dia ? `<div class="item"><div><div class="d">Orçamento do diário</div></div><div class="v">${num(c.dia)}</div></div>` : ""}
    </div><p class="hint" style="margin-top:6px">A reserva é a soma das contas do grupo “Reserva” no Patrimônio. Investimentos não entram aqui.</p>`}
  </section>`;
}

/* ───────── metas ───────── */
const META_TIPOS = { manual: "Juntar um valor", reserva: "Reserva de emergência", amort: "Amortizar o financiamento", quitar: "Quitar o financiamento" };
const metaIcon = m => m.emoji || ({ reserva: "🛟", amort: "💪", quitar: "🏁", manual: "🎯" }[m.tipo] || "🎯");
function amortTotal(desde) { return sum(Object.values(S.meses).flatMap(m => (m.itens || []).filter(i => !i.skip && i.cat === "Amortização do financiamento" && i.d >= desde + "-01").map(i => +i.v))); }
function extraParaQuitar(mesesAlvo) {
  const f = fin(); if (!f) return null;
  const Sd = finSaldo(), P = finPrazo();
  if (finSim(Sd, P, f.taxa, f.sist).meses <= mesesAlvo) return 0;
  let lo = 0, hi = Math.max(Sd, 1);
  for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (finSim(Sd, P, f.taxa, f.sist, mid).meses <= mesesAlvo) hi = mid; else lo = mid; }
  return Math.ceil(hi / 10) * 10;
}
function metaCalc(m) {
  const cy = curYm(), prazo = m.prazo || cy, ini = m.inicio || cy;
  const mesesRest = Math.max(1, monthsBetween(cy, prazo) + 1), mesesTot = Math.max(1, monthsBetween(ini, prazo) + 1), decorridos = Math.max(0, Math.min(mesesTot, monthsBetween(ini, cy)));
  let alvo = +m.alvo || 0, atual = 0, porMes = null, extra = "";
  if (m.tipo === "reserva") { const R = reservaInfo(); if (m.auto !== false) alvo = r2(R.custo.total * (+m.meses || 6)); atual = R.reserva; }
  else if (m.tipo === "amort") atual = amortTotal(ini);
  else if (m.tipo === "quitar") {
    const f = fin(), Sd = f ? finSaldo() : null;
    alvo = +m.saldoIni || Sd || 0; atual = Sd != null ? r2(Math.max(0, alvo - Sd)) : 0;
    if (f) { const x = extraParaQuitar(monthsBetween(cy, prazo) + 1); porMes = x; extra = x === 0 ? "No ritmo atual já quita até o prazo." : x != null ? `Amortize cerca de ${brl(x)} por mês além da parcela.` : ""; }
    else extra = "Configure o financiamento na aba Apartamento.";
  }
  else atual = sum((m.aportes || []).map(a => +a.v));
  const falta = r2(Math.max(0, alvo - atual)), pctV = alvo ? Math.min(1, atual / alvo) : 0;
  if (porMes == null) porMes = falta > 0 ? r2(falta / mesesRest) : 0;
  const esperado = alvo * decorridos / mesesTot, vencida = cy > prazo && falta > 0;
  const st = falta <= 0 ? ["good", "🎉 concluída"] : vencida ? ["bad", "prazo passou"] : atual + 0.01 >= esperado * 0.95 ? ["good", "no ritmo"] : ["warn", "atrasada"];
  return { alvo, atual, falta, pct: pctV, porMes, mesesRest, st, extra };
}

function ecoYear(y) {
  const rows = [];
  for (let mm = 1; mm <= 12; mm++) {
    const ym = `${y}-${pad(mm)}`, m = M(ym); if (!m) { rows.push({ ym, ent: 0, inv: 0, pct: null, prev: false, none: true }); continue; }
    const real = { ent: m.ent, inv: m.inv }, withP = { ent: r2(m.ent + m.pEnt), inv: r2(m.inv + m.pInv) };
    const fut = ym > curYm() || (m.pEnt + m.pInv > 0);
    const use = fut ? withP : real;
    rows.push({ ym, ...use, pct: use.ent ? use.inv / use.ent : null, prev: fut && (m.pEnt + m.pInv > 0), none: !use.ent && !use.inv });
  }
  const ms = rows.map(r => M(r.ym)).filter(Boolean);
  const tot = { ent: sum(ms.map(m => m.ent)), inv: sum(ms.map(m => m.inv)) }; tot.pct = tot.ent ? tot.inv / tot.ent : null;
  const all = rows.filter(r => !r.none); const proj = { ent: sum(all.map(r => r.ent)), inv: sum(all.map(r => r.inv)) }; proj.pct = proj.ent ? proj.inv / proj.ent : null;
  return { rows, tot, proj };
}

function exportData() {
  const data = JSON.stringify({ app: "financas-jose", exportadoEm: new Date().toISOString(), config: S.config, meses: S.meses, patrimonio: S.patrimonio }, null, 1);
  const name = `financas-jose-${today()}.json`;
  if (Store.mode === "claude") {
    if (!Store.dl) { toast("Baixar não está disponível nesta visualização."); return; }
    Store.dl.save({ filename: name, data }).then(() => toast("Backup salvo")).catch(e => { if (e?.code !== "declined") toast("Não consegui baixar o backup agora."); });
  } else {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Backup baixado");
  }
}

  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d !== "object" || !d.config || !d.meses) throw new Error("formato");
    dlg.open && dlg.close();
    toast("Importando…"); await Store.replaceAll(d); S.ready = true; render(); toast("Backup importado");
  } catch { toast("Esse arquivo não parece um backup deste app (.json exportado aqui)."); }
});
function openData() {
  const n = Object.values(S.meses).reduce((s, m) => s + (m.itens || []).length, 0);
  openDlg(`<h3>Dados e backup</h3>
    <p class="small" style="margin:0">${Store.mode === "claude" ? "Seus dados ficam salvos no Claude e aparecem igual no celular e no computador. Só você vê." : Drive.enabled() ? "Seus dados ficam neste navegador e são copiados para o seu Google Drive a cada alteração. Em outro aparelho, é só abrir o site e conectar o Drive." : "Seus dados ficam salvos neste navegador, neste aparelho. Exporte um backup de vez em quando — se limpar os dados do navegador, eles somem."}</p>
    ${Drive.available() ? `<div class="wz-tip"><b>Google Drive:</b> ${Drive.connected() ? `conectado. Os dados ficam no arquivo “${esc(DRIVE_FILE)}”, na raiz do seu Drive. O Drive guarda o histórico de versões desse arquivo.` : Drive.enabled() ? "desconectado nesta sessão. Conecte para enviar e receber alterações." : "ainda não conectado."}
      <div class="row" style="margin-top:8px">${Drive.connected() ? `<button class="btn sm" type="button" id="xSync">Sincronizar agora</button><button class="btn sm ghost" type="button" id="xDisc">Desconectar</button>` : `<button class="btn sm primary" type="button" id="xConn">☁ Conectar Drive</button>`}${GOOGLE_CLIENT_ID ? "" : `<button class="btn sm ghost" type="button" id="xCid">${Drive.clientId() ? "Trocar" : "Informar"} ID do cliente</button>`}</div></div>` : ""}
    <p class="small muted" style="margin:0">${n} lançamentos · ${(S.patrimonio?.contas || []).length} contas no patrimônio · ${(cfg().recorrentes || []).length} fixos</p>
    <div class="row"><button class="btn primary" type="button" id="xExp">Exportar backup (.json)</button><button class="btn" type="button" id="xImp">Importar backup</button></div>
    <p class="hint">Importar substitui tudo o que está aqui pelo conteúdo do arquivo. Use o mesmo arquivo para levar os dados entre a versão do Claude e a versão baixada.</p>
    ${S.config ? `<p class="hint" style="border-top:1px solid var(--line);padding-top:12px">Zerar apaga lançamentos, fixos e patrimônio e abre a configuração inicial de novo. Exporte um backup antes se quiser guardar.</p>` : ""}
    <div class="dlg-acts">${S.config ? `<button class="btn danger" type="button" data-del>Zerar tudo e começar de novo</button>` : ""}<button class="btn" type="button" data-cancel>Fechar</button></div>`, () => {}, async () => { dlg.close(); toast("Zerando…"); try { await Store.wipe(); } catch { toast("Não consegui zerar agora. Tente de novo."); return false; } UI.tab = "geral"; render(); toast("Tudo zerado. Vamos começar."); });
  $("#xExp").onclick = exportData;
  $("#xImp").onclick = () => $("#fileIn").click();
  $("#xConn")?.addEventListener("click", () => { dlg.close(); Drive.connect(); });
  $("#xDisc")?.addEventListener("click", () => { dlg.close(); Drive.disconnect(); toast("Drive desconectado. Os dados continuam neste aparelho."); });
  $("#xSync")?.addEventListener("click", () => { dlg.close(); (Drive.dirty ? Drive.push() : Drive.pull()).catch?.(e => Drive.onErr(e)); });
  $("#xCid")?.addEventListener("click", () => { dlg.close(); setTimeout(askClientId, 30); });
}

/* ───────── boot ───────── */
render();
if (window.claude && typeof window.claude.use === "function") Store.init();
else Store.initLocal();
})();
</script>
</body></html>
