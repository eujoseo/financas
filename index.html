<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Finanças do José</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: livro-caixa digital — cabeçalho fixo com abas, conteúdo em grade que vira uma coluna no celular.
   Cor: tinta verde-petróleo da cédula de R$ 100 sobre papel levemente esverdeado. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#eaf0ee; --ink:#11201c; --ink-2:#4a5a55; --muted:#7b8984;
  --line:#dbe3e0; --line-2:#c5d0cc; --accent:#0f5c63; --accent-ink:#ffffff; --accent-wash:#e1eff0;
  --s1:#2a78d6; --s2:#eb6834;
  --good:#006b2e; --good-wash:#e3f3e8; --warn:#8a5d00; --warn-wash:#fdf1d6; --bad:#c42f2f; --bad-wash:#fbe4e2;
  --prev:#7b8984; --today:#fff6d9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1312; --surface:#141c1a; --surface-2:#1b2523; --ink:#e6eeeb; --ink-2:#b2c0bb; --muted:#84948f;
  --line:#24302d; --line-2:#32403c; --accent:#5cb8bd; --accent-ink:#06201f; --accent-wash:#16312f;
  --s1:#3987e5; --s2:#d95926;
  --good:#3cc56a; --good-wash:#12291b; --warn:#f2b632; --warn-wash:#2c2410; --bad:#ef6b6b; --bad-wash:#311616;
  --prev:#84948f; --today:#2a2612; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1312; --surface:#141c1a; --surface-2:#1b2523; --ink:#e6eeeb; --ink-2:#b2c0bb; --muted:#84948f;
  --line:#24302d; --line-2:#32403c; --accent:#5cb8bd; --accent-ink:#06201f; --accent-wash:#16312f;
  --s1:#3987e5; --s2:#d95926;
  --good:#3cc56a; --good-wash:#12291b; --warn:#f2b632; --warn-wash:#2c2410; --bad:#ef6b6b; --bad-wash:#311616;
  --prev:#84948f; --today:#2a2612; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
@media (max-width:520px){.brand{width:100%}.brand .seal{display:none}.mode{margin-right:auto}}
.brand h1{font-size:20px}
.brand .seal{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mode{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.ok i{background:var(--good)} .mode.local i{background:var(--accent)} .mode.warn i{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;width:100%;margin-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 12px 11px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,tr[tabindex]:focus-visible,.cell-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:20px 60px}
.view{display:grid;gap:18px}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2,.grid-main{grid-template-columns:minmax(0,1fr)}}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.chip{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select,input[type=text],input[type=date],input[type=month],input[type=number],input[type=search]{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}

/* month nav */
.mnav{display:flex;align-items:center;gap:6px}
.mnav h2{font-size:22px;min-width:9.5ch;text-align:center;text-transform:capitalize}
.mnav .btn{padding:6px 10px}

/* hero + tiles */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:0;padding:0;overflow:hidden}
.hero > div{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.hero > div:first-child{border-left:0;background:var(--accent-wash)}
.hero .big{font-family:var(--f-display);font-size:clamp(30px,4.2vw,46px);font-weight:700;line-height:1.05;margin:6px 0 4px;letter-spacing:-.02em}
.hero .val{font-family:var(--f-display);font-size:24px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em}
@media (max-width:860px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}.hero > div:first-child{grid-column:1/-1}.hero > div:nth-child(2){border-left:0}.hero > div{border-top:1px solid var(--line)}.hero > div:first-child{border-top:0}.hero > div:nth-child(4){grid-column:1/-1;border-left:0}}
.delta{font-size:12.5px;font-weight:500}
.up{color:var(--good)} .down{color:var(--bad)}

/* banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--r);padding:12px 14px}
.banner b{color:var(--ink)}
.banner .ic{font-weight:700;color:var(--warn);margin-right:6px}

/* meters */
.meter{display:grid;gap:4px}
.meter .bar{height:8px;border-radius:4px;background:var(--accent-wash);overflow:hidden}
.meter .bar > span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter.over .bar > span{background:var(--bad)}
.meter.near .bar > span{background:var(--warn)}
.meters{display:grid;gap:12px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.strip > div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.strip > div:first-child{border-left:0}
.strip .v{font-family:var(--f-num);font-size:15px;font-weight:500;margin-top:3px;white-space:nowrap;overflow-wrap:anywhere}
.strip .p{font-size:11.5px;color:var(--prev)}
@media (max-width:860px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip > div:nth-child(4){border-left:0}.strip > div:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:460px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip > div{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}.strip > div:nth-child(odd){border-left:0!important}.strip > div:nth-child(-n+2){border-top:0}}

/* the cédula (day grid) */
.ledger-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.ledger{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.8px}
.ledger th{font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line-2);background:var(--surface-2);position:sticky;top:0}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr:hover td{background:var(--surface-2)}
.ledger tr.sel td{background:var(--accent-wash)!important}
.ledger tr.today td{background:var(--today)}
.ledger tr.today td:first-child{font-weight:600}
.ledger tr.today td:first-child::after{content:" hoje";font-family:var(--f-body);font-size:10.5px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ledger tr.wk td:first-child{color:var(--muted)}
.ledger .wd{color:var(--muted);font-size:11px;margin-left:4px}
.ledger .z{color:var(--line-2)}
.ledger .pv{color:var(--prev);font-style:italic}
.ledger .pv-add{display:block;font-size:10.5px;color:var(--prev);font-style:italic}
@media (max-width:520px){.ledger{font-size:11.5px}.ledger td,.ledger th{padding:5px 5px}.ledger th{font-size:9.5px;letter-spacing:.03em}.ledger .wd{display:none}.ledger .pv-add{font-size:9.5px}.ledger tr.today td:first-child::after{content:" •"}}
.ledger tfoot td{font-weight:500;border-top:1px solid var(--line-2);border-bottom:0;background:var(--surface-2);padding:8px 10px}
.saldo{font-weight:500}
.s-bom{color:var(--good)} .s-ok{color:var(--ink)} .s-alerta{color:var(--warn)} .s-neg{color:var(--bad)}
.s-crit{color:var(--bad);background:var(--bad-wash)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.l{height:2px;width:14px;border-radius:1px}

/* item lists */
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .d{font-weight:500;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted)}
.item .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.item.prev .d,.item.prev .v{color:var(--prev);font-style:italic}
.item.click{cursor:pointer}
.item.click:hover{background:var(--surface-2)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);margin-right:6px;font-style:normal}
.tag.entrada{background:color-mix(in srgb,var(--s1) 14%,transparent);color:var(--ink)}
.tag.saida{background:color-mix(in srgb,var(--s2) 16%,transparent);color:var(--ink)}
.tag.diario{background:var(--warn-wash);color:var(--ink)}
.tag.invest{background:var(--good-wash);color:var(--ink)}
.tag.prev{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.v.entrada{color:var(--good)}
.empty{padding:22px 4px;color:var(--muted);text-align:center}

/* data tables */
.tbl-wrap{overflow-x:auto}
.tbl{font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.grp td{font-weight:600;background:var(--surface-2)}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--line-2)}
.tbl tr.pv td{color:var(--prev);font-style:italic}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl input.cell{width:118px;text-align:right;font-family:var(--f-num);padding:4px 6px}
.tbl td.inh{color:var(--muted)}
.tbl th.cur,.tbl td.cur{background:var(--accent-wash)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;font-family:var(--f-body);font-style:normal}
.pill.good{background:var(--good-wash);color:var(--good)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.warn{background:var(--warn-wash);color:var(--warn)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .bar{transition:opacity .15s}
.chart .bar:hover{opacity:.8}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-width:140px;max-width:260px}
.tip .t{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r b{font-family:var(--f-num);font-weight:500}
.tip .k{display:inline-block;width:12px;height:2px;border-radius:1px;margin-right:6px;vertical-align:middle}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:12px}
.hbar .track span{display:block;height:100%;max-width:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.hbar .val{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);white-space:nowrap}

/* fab, dialog, toast */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:13px 20px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
dialog{border:1px solid var(--line-2);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(5,15,13,.45)}
dialog form{display:grid;gap:14px;padding:18px}
dialog h3{font-size:18px}
.fld{display:grid;gap:5px}
.fld > span{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select{width:100%}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg label{text-align:center;padding:8px 4px;cursor:pointer;font-size:13px;font-weight:500;border-left:1px solid var(--line-2)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:-3px}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-acts .btn.danger{margin-right:auto}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;max-width:calc(100vw - 32px)}
.wz{max-width:780px;margin:0 auto;display:grid;gap:16px}
.wz-prog{display:flex;gap:4px}
.wz-prog span{flex:1;display:grid;gap:5px;min-width:0}
.wz-prog i{height:4px;border-radius:2px;background:var(--line)}
.wz-prog span.done i{background:var(--accent)} .wz-prog span.cur i{background:var(--accent);opacity:.55}
.wz-prog em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz-prog span.cur em{color:var(--ink);font-weight:600}
@media (max-width:620px){.wz-prog em{display:none}.wz-prog span.cur em{display:block;position:absolute;opacity:0}}
.wz-card{display:grid;gap:12px;padding:20px}
.wz-card p{margin:0}
.wz-h{font-size:22px}
.wz-sub{font-size:15px;margin-top:6px}
.wz-list{margin:0;padding-left:20px;display:grid;gap:6px}
.wz-tip{background:var(--accent-wash);border-radius:8px;padding:10px 12px;font-size:13px}
.wz-rows{display:grid;gap:8px}
.wz-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.wz-f{flex:1 1 110px;min-width:0}
.wz-f.wide{flex:3 1 220px}
.wz-f input,.wz-f select{width:100%}
.wz-del{flex:0 0 auto}
.wz-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;flex-wrap:wrap}
.ledger tr.before td{color:var(--line-2);cursor:default}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Finanças do José</h1><span class="seal" id="seal">R$ · livro-caixa</span></div>
    <span class="mode" id="mode"><i></i><span>Carregando…</span></span>
    <button class="btn sm" id="driveBtn" type="button" hidden>☁ Conectar Drive</button>
    <button class="btn sm" id="dataBtn" type="button">Dados e backup</button>
    <button class="btn sm primary" id="fab" type="button">+ Lançar</button>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="geral">Visão geral</button>
      <button class="tab" role="tab" data-tab="mes">Mês</button>
      <button class="tab" role="tab" data-tab="lanc">Lançamentos</button>
      <button class="tab" role="tab" data-tab="fixos">Fixos</button>
      <button class="tab" role="tab" data-tab="eco">Economia</button>

<script>
(() => {
"use strict";
/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

const DSEM = ["dom","seg","ter","qua","qui","sex","sáb"];

const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const curYm = () => today().slice(0, 7);
const ymAdd = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const dim = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${MES[m - 1]} ${y}`; };

const dLabel = ds => { const [y, m, d] = ds.split("-").map(Number); return `${pad(d)}/${pad(m)}`; };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseMoney = s => {
  s = String(s ?? "").trim().replace(/[R$\s]/g, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");

const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };

/* ───────── state ───────── */
const DEFAULT_CONFIG = () => ({
  versao: 1,
  saldoInicial: { mes: curYm(), valor: 0 },
  inicioPrevisao: curYm(),
  metaEconomia: 0.3,
  faixas: { bom: 2000, ok: 1000, alerta: -500 },
  categorias: {
    entrada: ["Salário", "Honorários", "Auxílio família", "Ajustes", "Outras entradas"],
    saida: ["Moradia", "Cartão de crédito", "Saúde", "Esporte", "Trabalho", "Estudos", "Seguro", "Telefone", "Viagem", "Lazer", "Ajustes", "Outros"],
    diario: ["Lanches", "Mercado", "Saúde", "Barbearia", "Gasolina", "Outros"],
    invest: ["Reserva de emergência", "Investimentos"]

  cartoes: [],
  orcDiario: [],
  recorrentes: []
});
const DEFAULT_PAT = () => ({ contas: [], valores: {} });
const S = { config: null, meses: {}, patrimonio: null, ready: false };
const UI = { tab: "geral", ym: curYm(), day: null, lancYm: curYm(), lancTipo: "", lancQ: "", ecoYear: +curYm().slice(0, 4), patYm: curYm() };
try { const t = lsGet("fj-ui-tab"); if (t) UI.tab = t; } catch {}

/* ───────── storage: Claude db when available, browser otherwise ───────── */
const LS_KEY = "financas-jose-v1";
const Store = {
  mode: "loading", db: null, dl: null, queues: {}, hasData: false,
  async init() {
    let db = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { db = await window.claude.use("db"); } catch { db = null; }
      try { this.dl = await window.claude.use("downloads"); } catch { this.dl = null; }
    }

    else this.initLocal();
  },
  initLocal() {
    this.mode = "local";
    let data = null;
    const raw = lsGet(LS_KEY);
    if (raw) { try { data = JSON.parse(raw); } catch { data = null; } }
    if (!data) { try { data = JSON.parse($("#seed").textContent || "null"); } catch { data = null; } if (data) this.saveLocalData(data); }
    this.localOk = lsSet(LS_KEY + "-probe", "1");
    if (data && data.config) applyData(data); else { S.config = null; S.meses = {}; S.patrimonio = DEFAULT_PAT(); }
    S.atualizadoEm = data?.atualizadoEm || null;
    this.hasData = !!(data && data.config);

    Drive.boot();
  },
  adoptRemote(remote) {
    this.saveLocalData(remote);
    if (remote && remote.config) applyData(remote); else { S.config = null; S.meses = {}; S.patrimonio = DEFAULT_PAT(); }
    S.atualizadoEm = remote?.atualizadoEm || null;
    render();
  },
  saveLocalData(d) { return lsSet(LS_KEY, JSON.stringify(d)); },
  persistLocal() {
    S.atualizadoEm = stamp();
    const ok = this.saveLocalData({ atualizadoEm: S.atualizadoEm, config: S.config, meses: S.meses, patrimonio: S.patrimonio });
    if (!ok && !Drive.enabled()) toast("O navegador não deixou salvar. Use “Dados e backup” → Exportar para não perder nada.");
    Drive.changed();
  },
  subscribe() {
    const db = this.db; let got = { c: false, p: false, m: false };
    const done = () => { if (got.c && got.p && got.m && !S.ready) { S.ready = true; } render(); };
    const err = e => { if (e && e.code === "revoked") { setMode("warn", "Acesso aos dados encerrado"); } else toast("Não consegui ler os dados agora."); };
    db.doc("app/config").onSnapshot(s => { S.config = s.exists ? normConfig(s.data()) : null; this.hasData = this.hasData || s.exists; got.c = true; done(); }, err);
    db.doc("app/patrimonio").onSnapshot(s => { S.patrimonio = s.exists ? clone(s.data()) : DEFAULT_PAT(); got.p = true; done(); }, err);
    db.collection("meses").onSnapshot(q => { const m = {}; q.docs.forEach(d => { m[d.id] = clone(d.data()); }); S.meses = m; if (q.size) this.hasData = true; got.m = true; done(); }, err);
  },
  enqueue(path, fn) {
    const p = (this.queues[path] || Promise.resolve()).then(fn).catch(async e => {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { return await fn(); } catch {} }
      toast(e && e.code === "quota_exceeded" ? "Espaço de dados cheio. Exporte um backup e apague meses antigos." : "Não consegui salvar. Tente de novo em instantes.");
    });
    this.queues[path] = p; return p;
  },
  saveMonth(ym) {
    if (this.mode === "claude") { const data = { itens: (S.meses[ym]?.itens || []).map(clean) }; return this.enqueue("meses/" + ym, () => data.itens.length ? this.db.doc("meses/" + ym).set(data) : this.db.doc("meses/" + ym).delete()); }
    this.persistLocal();
  },
  saveConfig() { if (this.mode === "claude") { const d = clone(S.config); return this.enqueue("app/config", () => this.db.doc("app/config").set(d)); } this.persistLocal(); },
  savePat() { if (this.mode === "claude") { const d = clone(S.patrimonio); return this.enqueue("app/patrimonio", () => this.db.doc("app/patrimonio").set(d)); } this.persistLocal(); },
  finishSetup(config, pat) {
    S.config = normConfig(config); S.patrimonio = pat; S.meses = {};
    if (this.mode === "claude") { this.saveConfig(); this.savePat(); } else this.persistLocal();
    this.hasData = true;
  },
  async wipe() {
    if (this.mode === "claude") {
      const db = this.db, old = await db.collection("meses").get();
      for (const d of old.docs) await db.doc("meses/" + d.id).delete();
      await db.doc("app/patrimonio").delete(); await db.doc("app/config").delete();
    }
    S.config = null; S.meses = {}; S.patrimonio = DEFAULT_PAT();
    if (this.mode !== "claude") { S.atualizadoEm = stamp(); this.saveLocalData({ atualizadoEm: S.atualizadoEm, config: null, meses: {}, patrimonio: null }); Drive.changed(); }
  },
  async replaceAll(data) {
    applyData(data);
    if (this.mode === "claude") {
      const db = this.db;
      const old = await db.collection("meses").get();
      for (const d of old.docs) if (!S.meses[d.id]) await db.doc("meses/" + d.id).delete();
      await db.doc("app/config").set(clone(S.config));
      await db.doc("app/patrimonio").set(clone(S.patrimonio));
      for (const [ym, m] of Object.entries(S.meses)) await db.doc("meses/" + ym).set({ itens: (m.itens || []).map(clean) });
    } else this.persistLocal();
    this.hasData = true;
  }
};
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const clean = i => { const o = {}; for (const k of ["id","d","t","v","desc","cat","rec","skip","pag"]) if (i[k] !== undefined && i[k] !== null && i[k] !== "") o[k] = i[k]; return o; };
function normConfig(c) {
  const d = DEFAULT_CONFIG(); c = clone(c) || {};
  const out = { ...d, ...c };
  out.categorias = { ...d.categorias, ...(c.categorias || {}) };
  out.faixas = { ...d.faixas, ...(c.faixas || {}) };
  out.saldoInicial = { ...d.saldoInicial, ...(c.saldoInicial || {}) };
  for (const k of ["cartoes", "orcDiario", "recorrentes"]) if (!Array.isArray(out[k])) out[k] = [];
  return out;
}
function applyData(data) {
  S.config = normConfig(data?.config || DEFAULT_CONFIG());
  S.meses = clone(data?.meses || {}) || {};
  S.patrimonio = clone(data?.patrimonio || DEFAULT_PAT());
  if (!S.patrimonio.contas) S.patrimonio.contas = [];
  if (!S.patrimonio.valores) S.patrimonio.valores = {};
}
let _defCfg = null;
const cfg = () => S.config || _defCfg || (_defCfg = DEFAULT_CONFIG());

/* ───────── Google Drive (versão hospedada, ex.: GitHub Pages) ───────── */
const GOOGLE_CLIENT_ID = ""; // ← cole aqui, entre as aspas, o "ID do cliente" do Google Cloud (termina em .apps.googleusercontent.com)
const DRIVE_FILE = "Finanças do José - dados.json";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
// Marca de versão única: data/hora + sufixo aleatório (dois aparelhos nunca geram a mesma).
const stamp = () => new Date().toISOString() + "~" + Math.random().toString(36).slice(2, 8);
const Drive = {
  token: null, exp: 0, state: "off", timer: null, gisP: null, busy: false,
  get fileId() { return lsGet("fj-drive-file") || null; },
  set fileId(v) { if (v) lsSet("fj-drive-file", v); else { try { localStorage.removeItem("fj-drive-file"); } catch {} } },
  get dirty() { return lsGet("fj-drive-dirty") === "1"; },
  set dirty(v) { lsSet("fj-drive-dirty", v ? "1" : "0"); },
  available() { return Store.mode === "local" && !window.claude && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)); },
  clientId() { return String(GOOGLE_CLIENT_ID || lsGet("fj-drive-client") || "").trim(); },
  enabled() { return this.available() && lsGet("fj-drive-on") === "1"; },
  connected() { return !!this.token && Date.now() < this.exp; },
  label() {
    if (this.state === "saving") return ["local", "Salvando no Drive…"];
    if (this.state === "error") return ["warn", this.dirty ? "Não enviado ao Drive" : "Drive com erro"];
    if (this.connected()) return ["ok", this.dirty ? "Enviando ao Drive…" : "Salvo no Google Drive"];
    return ["warn", this.dirty ? "Alterações só neste aparelho" : "Drive desconectado"];
  },
  boot() { if (this.available()) this.loadGis().catch(() => {}); updateMode(); },
  loadGis() {
    if (window.google?.accounts?.oauth2) return Promise.resolve();
    return this.gisP || (this.gisP = new Promise((res, rej) => {
      const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
      sc.onload = () => res(); sc.onerror = () => { this.gisP = null; rej(new Error("gis")); };
      document.head.appendChild(sc);
    }));
  },
  connect() {
    if (!this.clientId()) { askClientId(); return; }
    if (!window.google?.accounts?.oauth2) { toast("Carregando o login do Google… toque de novo em alguns segundos."); this.loadGis().catch(() => toast("Não consegui carregar o login do Google. Confira a internet.")); return; }
    const first = lsGet("fj-drive-on") !== "1";
    let tc;
    try {
      tc = google.accounts.oauth2.initTokenClient({ client_id: this.clientId(), scope: DRIVE_SCOPE, callback: r => this.onToken(r), error_callback: e => this.onTokenErr(e) });
    } catch { toast("O ID do cliente parece inválido. Confira em Dados e backup."); return; }
    tc.requestAccessToken({ prompt: first ? "consent" : "" });
  },
  onToken(r) {
    if (!r || !r.access_token) return this.onTokenErr(r);
    if (r.scope && !String(r.scope).includes("drive.file")) { toast("É preciso marcar a permissão do Google Drive para salvar lá."); return; }
    this.token = r.access_token; this.exp = Date.now() + ((+r.expires_in || 3600) - 120) * 1000;
    lsSet("fj-drive-on", "1"); this.state = "ok";
    this.pull(true);
  },
  onTokenErr(e) {
    const t = e?.type || e?.error || "";
    toast(t === "popup_closed" || t === "access_denied" ? "Login no Google cancelado." : t === "popup_failed_to_open" ? "O navegador bloqueou a janela do Google. Libere pop-ups para este site e tente de novo." : "O Google não autorizou. Confira o ID do cliente e se este endereço está nas origens autorizadas.");
    updateMode();
  },
  disconnect() { try { if (this.token) google.accounts.oauth2.revoke(this.token, () => {}); } catch {} this.token = null; lsSet("fj-drive-on", "0"); this.state = "off"; render(); },
  async api(url, opts = {}) {
    if (!this.connected()) throw { code: "expired" };
    let r;
    try { r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + this.token } }); } catch { throw { code: "offline" }; }
    if (r.status === 401) { this.token = null; throw { code: "expired" }; }
    if (!r.ok) throw { code: "http", status: r.status };
    return r;
  },
  async findFile() {
    const id = this.fileId;
    if (id) {
      try { const m = await (await this.api(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?fields=id,trashed`)).json(); if (!m.trashed) return id; }
      catch (e) { if (e.code !== "http") throw e; }
      this.fileId = null;
    }
    const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
    const l = await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)`)).json();
    const f = (l.files || [])[0]; if (f) this.fileId = f.id;
    return f ? f.id : null;
  },
  snapshot() { if (!S.atualizadoEm) S.atualizadoEm = stamp(); return { app: "financas-jose", atualizadoEm: S.atualizadoEm, config: S.config, meses: S.meses, patrimonio: S.config ? S.patrimonio : null }; },
  async pull(fromConnect = false) {
    if (this.busy) return; this.busy = true;
    try {
      const id = await this.findFile();
      if (!id) {
        if (S.config || this.dirty) await this.push();
        if (fromConnect) toast(S.config ? "Drive conectado. Seus dados agora ficam salvos lá." : "Drive conectado. Quando você concluir a configuração, os dados vão para lá.");
      } else {
        const remote = await (await this.api(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media`)).json();
        const lt = S.atualizadoEm || "", rt = remote?.atualizadoEm || "", base = lsGet("fj-drive-base") || "";
        const remoteChanged = rt !== base;                         // outro aparelho gravou desde a última sincronização deste
        const neverSynced = !base && !!S.config;                   // este aparelho tem dados que nunca foram ao Drive
        if ((this.dirty && !remoteChanged) || (neverSynced && lt > rt)) { await this.push(); if (fromConnect) toast("Drive conectado. Enviei as alterações deste aparelho."); }
        else if (rt !== lt) {
          const conflict = this.dirty && remoteChanged;
          if (conflict && lt > rt) { await this.push(); toast("Este aparelho e outro mudaram os dados; fiquei com a versão mais recente (a deste aparelho)."); }
          else { Store.adoptRemote(remote); lsSet("fj-drive-base", rt); this.dirty = false; toast(conflict ? "Este aparelho e outro mudaram os dados; fiquei com a versão mais recente (a do Drive)." : fromConnect ? "Drive conectado. Dados carregados do seu Drive." : "Atualizado com as alterações de outro aparelho."); }
        }
        else { lsSet("fj-drive-base", rt); this.dirty = false; if (fromConnect) toast("Drive conectado e em dia."); }
      }
      this.state = "ok";
    } catch (e) { this.onErr(e); }
    this.busy = false; render();
  },
  async push() {
    clearTimeout(this.timer);
    const snap = this.snapshot(), body = JSON.stringify(snap);
    this.state = "saving"; updateMode();
    let id = this.fileId;
    if (id) {
      try { await this.api(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(id)}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body }); }
      catch (e) { if (e.code === "http" && e.status === 404) { this.fileId = null; id = null; } else throw e; }
    }
    if (!id) {
      const b = "fj" + Math.random().toString(36).slice(2);
      const meta = JSON.stringify({ name: DRIVE_FILE, mimeType: "application/json" });
      const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      const r = await (await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + b }, body: mp })).json();
      this.fileId = r.id;
    }
    lsSet("fj-drive-base", snap.atualizadoEm);
    this.dirty = S.atualizadoEm !== snap.atualizadoEm; this.state = "ok"; updateMode();
    if (this.dirty) this.changed();
  },
  changed() {
    if (!this.enabled()) return;
    this.dirty = true; clearTimeout(this.timer);
    if (!this.connected()) { updateMode(); return; }
    this.state = "ok"; updateMode();
    this.timer = setTimeout(() => this.push().catch(e => this.onErr(e)), 1200);
  },
  onErr(e) {
    if (e?.code === "expired") { this.token = null; this.state = "off"; toast("A sessão do Google expirou (dura 1 hora). Toque em “Conectar Drive” para continuar salvando lá."); }
    else if (e?.code === "offline") { this.state = "error"; toast("Sem internet. As alterações ficam neste aparelho e vão para o Drive quando a conexão voltar."); }
    else { this.state = "error"; toast("O Drive recusou a gravação" + (e?.status ? ` (erro ${e.status})` : "") + ". Tente “Sincronizar agora” em Dados e backup."); }
    updateMode();
  }
};
function askClientId() {
  openSimple("Configurar Google Drive", [{ id: "cid", label: "ID do cliente do Google Cloud", value: lsGet("fj-drive-client") || "" }], d => {
    if (!/^[\w-]+\.apps\.googleusercontent\.com$/.test(d.cid)) return "Esse não parece um ID do cliente. Ele termina em .apps.googleusercontent.com";
    lsSet("fj-drive-client", d.cid); toast("ID salvo. Agora toque em “Conectar Drive”."); updateMode();
  }, null, "Fica no Google Cloud, em APIs e serviços › Credenciais. Fica guardado só neste aparelho; para não precisar digitar no celular, coloque o ID dentro do index.html.");
}

/* ───────── engine ───────── */
const monthItems = ym => S.meses[ym]?.itens || [];
const recActive = (r, ym) => ym >= (cfg().inicioPrevisao || "0000-00") && ym >= (r.inicio || "0000-00") && (!r.fim || ym <= r.fim);
const isCard = pag => (cfg().cartoes || []).some(c => c.nome === pag);
function previstos(ym) {
  const items = monthItems(ym), n = dim(ym);
  const covered = new Set(items.filter(i => i.rec).map(i => i.rec));
  const out = [];
  const cards = new Map((cfg().cartoes || []).map(c => [c.nome, { ...c, parts: [] }]));
  for (const r of cfg().recorrentes || []) {
    if (!recActive(r, ym)) continue;
    if (cards.has(r.pag)) { cards.get(r.pag).parts.push(r); continue; }
    if (covered.has(r.id)) continue;
    out.push({ prev: true, rec: r.id, d: `${ym}-${pad(Math.min(+r.dia || 1, n))}`, t: r.t, v: r2(r.v), desc: r.desc, cat: r.cat, pag: r.pag });
  }
  for (const c of cards.values()) {
    if (!c.parts.length) continue;
    const key = "fatura:" + c.nome;
    if (covered.has(key)) continue;
    out.push({ prev: true, rec: key, d: `${ym}-${pad(Math.min(+c.venc || 10, n))}`, t: "saida", v: sum(c.parts.map(p => p.v)), desc: "Fatura " + c.nome, cat: "Cartão de crédito", pag: c.nome, parts: c.parts });
  }

}

/* economia */
function ecoYear(y) {
  const rows = [];
  for (let mm = 1; mm <= 12; mm++) {
    const ym = `${y}-${pad(mm)}`, m = M(ym); if (!m) { rows.push({ ym, ent: 0, inv: 0, pct: null, prev: false, none: true }); continue; }
    const real = { ent: m.ent, inv: m.inv }, withP = { ent: r2(m.ent + m.pEnt), inv: r2(m.inv + m.pInv) };
    const fut = ym > curYm() || (m.pEnt + m.pInv > 0);
    const use = fut ? withP : real;
    rows.push({ ym, ...use, pct: use.ent ? use.inv / use.ent : null, prev: fut && (m.pEnt + m.pInv > 0), none: !use.ent && !use.inv });
  }
  const ms = rows.map(r => M(r.ym)).filter(Boolean);
  const tot = { ent: sum(ms.map(m => m.ent)), inv: sum(ms.map(m => m.inv)) }; tot.pct = tot.ent ? tot.inv / tot.ent : null;
  const all = rows.filter(r => !r.none); const proj = { ent: sum(all.map(r => r.ent)), inv: sum(all.map(r => r.inv)) }; proj.pct = proj.ent ? proj.inv / proj.ent : null;
  return { rows, tot, proj };
}
function viewEco(v) {
  const years = [...new Set(CALC.order.map(ym => +ym.slice(0, 4)))];
  if (!years.includes(UI.ecoYear)) UI.ecoYear = years.includes(+curYm().slice(0, 4)) ? +curYm().slice(0, 4) : years[0];
  const E = ecoYear(UI.ecoYear), meta = cfg().metaEconomia || 0;
  v.innerHTML = `<div class="grid-main">
    <section class="card"><div class="spread"><div><h2>Economia</h2><p class="sub" style="margin:0">Quanto do que entrou foi para investimento, mês a mês.</p></div>
      <select id="eY" aria-label="Ano">${years.map(y => `<option ${y === UI.ecoYear ? "selected" : ""}>${y}</option>`).join("")}</select></div>
      <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Mês</th><th class="n">Entradas</th><th class="n">Economia</th><th class="n">%</th><th>Meta ${pct(meta)}</th></tr></thead><tbody>
      ${E.rows.map(r => `<tr class="${r.prev ? "pv" : ""}"><td style="text-transform:capitalize">${MES[+r.ym.slice(5) - 1]}${r.prev ? ' <span class="tag prev">previsto</span>' : ""}</td><td class="n">${r.none ? "–" : num(r.ent)}</td><td class="n">${r.none ? "–" : num(r.inv)}</td><td class="n">${pct(r.pct)}</td><td>${r.pct == null ? "" : r.pct >= meta ? '<span class="pill good">✓ bateu</span>' : '<span class="pill warn">abaixo</span>'}</td></tr>`).join("")}
      <tr class="tot"><td>Total confirmado</td><td class="n">${num(E.tot.ent)}</td><td class="n">${num(E.tot.inv)}</td><td class="n">${pct(E.tot.pct)}</td><td></td></tr>
      <tr class="pv"><td>Com previsão até dezembro</td><td class="n">${num(E.proj.ent)}</td><td class="n">${num(E.proj.inv)}</td><td class="n">${pct(E.proj.pct)}</td><td></td></tr>

    <div class="fld-row"><label class="fld"><span>Valor por mês (R$)</span><input type="text" id="rV" inputmode="decimal" value="${r.v != null ? num(r.v) : ""}"></label>
      <label class="fld"><span>Dia do mês</span><input type="number" id="rDia" min="1" max="31" value="${r.dia || 1}"></label></div>
    <div class="fld-row"><label class="fld"><span>Categoria</span><select id="rCat">${catOptions(r.t || "saida", r.cat).replace('<option value="__new">+ Nova categoria…</option>', "")}</select></label>
      <label class="fld"><span>Pagamento</span><select id="rPag">${[...new Set([r.pag, ...pags].filter(Boolean))].map(p => `<option ${p === r.pag ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></label></div>
    <div class="fld-row"><label class="fld"><span>Começa em</span><input type="month" id="rIni" value="${esc(r.inicio || curYm())}"></label>
      <label class="fld"><span>Última parcela (opcional)</span><input type="month" id="rFim" value="${esc(r.fim || "")}"></label></div>
    <p class="hint">No cartão, o dia é ignorado: o item entra na fatura do cartão. Parcelados param de aparecer depois da última parcela.</p>
    <p class="err small down" hidden></p>
    <div class="dlg-acts">${isNew ? "" : `<button class="btn danger" type="button" data-del>Apagar fixo</button>`}<button class="btn" type="button" data-cancel>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div>`,
  () => {
    const t = dform.querySelector("input[name=t]:checked").value, v = parseMoney($("#rV").value), desc = $("#rDesc").value.trim();
    if (!desc) return "Dê uma descrição."; if (isNaN(v) || v <= 0) return "Informe um valor maior que zero.";
    const ini = $("#rIni").value || curYm(), fim = $("#rFim").value || null;
    if (fim && fim < ini) return "A última parcela não pode ser antes do início.";
    const obj = { id: r.id || uid(), desc, t, v, dia: Math.max(1, Math.min(31, +$("#rDia").value || 1)), cat: $("#rCat").value, pag: $("#rPag").value, inicio: ini, fim };
    if (isNew) c.recorrentes.push(obj); else c.recorrentes[c.recorrentes.findIndex(x => x.id === r.id)] = obj;
    Store.saveConfig(); render(); toast("Fixo salvo");
  }, isNew ? null : () => { c.recorrentes = c.recorrentes.filter(x => x.id !== r.id); Store.saveConfig(); render(); toast("Fixo apagado. Lançamentos já confirmados continuam."); });
  dform.querySelectorAll("input[name=t]").forEach(x => x.addEventListener("change", () => { $("#rCat").innerHTML = catOptions(x.value, null).replace('<option value="__new">+ Nova categoria…</option>', ""); }));
}
function openSimple(title, fields, onSave, onDelete = null, note = "") {
  openDlg(`<h3>${esc(title)}</h3>${fields.map(f => `<label class="fld"><span>${esc(f.label)}</span>${f.type === "select" ? `<select id="s-${f.id}">${f.options.map(o => `<option value="${esc(o)}" ${o === f.value ? "selected" : ""}>${esc(f.labels?.[o] || o)}</option>`).join("")}${f.allowNew ? `<option value="__new">+ Outra…</option>` : ""}</select>${f.allowNew ? `<input type="text" id="s-${f.id}-new" placeholder="Nome" hidden>` : ""}` : `<input type="${f.type === "number" ? "number" : "text"}" id="s-${f.id}" ${f.money ? 'inputmode="decimal" placeholder="0,00"' : ""} value="${esc(f.money && f.value != null ? num(f.value) : f.value ?? "")}">`}</label>`).join("")}
    ${note ? `<p class="hint">${esc(note)}</p>` : ""}<p class="err small down" hidden></p>
    <div class="dlg-acts">${onDelete ? `<button class="btn danger" type="button" data-del>Remover</button>` : ""}<button class="btn" type="button" data-cancel>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div>`,
  () => { const d = {}; for (const f of fields) { let x = $("#s-" + f.id).value; if (x === "__new") x = $("#s-" + f.id + "-new").value.trim(); d[f.id] = f.money ? (parseMoney(x) || 0) : typeof x === "string" ? x.trim() : x; } return onSave(d); }, onDelete);
  fields.filter(f => f.allowNew).forEach(f => $("#s-" + f.id).addEventListener("change", e => { $("#s-" + f.id + "-new").hidden = e.target.value !== "__new"; }));
}

/* ───────── backup ───────── */
function exportData() {
  const data = JSON.stringify({ app: "financas-jose", exportadoEm: new Date().toISOString(), config: S.config, meses: S.meses, patrimonio: S.patrimonio }, null, 1);
  const name = `financas-jose-${today()}.json`;
  if (Store.mode === "claude") {
    if (!Store.dl) { toast("Baixar não está disponível nesta visualização."); return; }
    Store.dl.save({ filename: name, data }).then(() => toast("Backup salvo")).catch(e => { if (e?.code !== "declined") toast("Não consegui baixar o backup agora."); });
  } else {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Backup baixado");
  }
}
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d !== "object" || !d.config || !d.meses) throw new Error("formato");
    dlg.open && dlg.close();
    toast("Importando…"); await Store.replaceAll(d); S.ready = true; render(); toast("Backup importado");
  } catch { toast("Esse arquivo não parece um backup deste app (.json exportado aqui)."); }
});
function openData() {
  const n = Object.values(S.meses).reduce((s, m) => s + (m.itens || []).length, 0);
  openDlg(`<h3>Dados e backup</h3>
    <p class="small" style="margin:0">${Store.mode === "claude" ? "Seus dados ficam salvos no Claude e aparecem igual no celular e no computador. Só você vê." : Drive.enabled() ? "Seus dados ficam neste navegador e são copiados para o seu Google Drive a cada alteração. Em outro aparelho, é só abrir o site e conectar o Drive." : "Seus dados ficam salvos neste navegador, neste aparelho. Exporte um backup de vez em quando — se limpar os dados do navegador, eles somem."}</p>
    ${Drive.available() ? `<div class="wz-tip"><b>Google Drive:</b> ${Drive.connected() ? `conectado. Os dados ficam no arquivo “${esc(DRIVE_FILE)}”, na raiz do seu Drive. O Drive guarda o histórico de versões desse arquivo.` : Drive.enabled() ? "desconectado nesta sessão. Conecte para enviar e receber alterações." : "ainda não conectado."}
      <div class="row" style="margin-top:8px">${Drive.connected() ? `<button class="btn sm" type="button" id="xSync">Sincronizar agora</button><button class="btn sm ghost" type="button" id="xDisc">Desconectar</button>` : `<button class="btn sm primary" type="button" id="xConn">☁ Conectar Drive</button>`}${GOOGLE_CLIENT_ID ? "" : `<button class="btn sm ghost" type="button" id="xCid">${Drive.clientId() ? "Trocar" : "Informar"} ID do cliente</button>`}</div></div>` : ""}
    <p class="small muted" style="margin:0">${n} lançamentos · ${(S.patrimonio?.contas || []).length} contas no patrimônio · ${(cfg().recorrentes || []).length} fixos</p>
    <div class="row"><button class="btn primary" type="button" id="xExp">Exportar backup (.json)</button><button class="btn" type="button" id="xImp">Importar backup</button></div>
    <p class="hint">Importar substitui tudo o que está aqui pelo conteúdo do arquivo. Use o mesmo arquivo para levar os dados entre a versão do Claude e a versão baixada.</p>
    ${S.config ? `<p class="hint" style="border-top:1px solid var(--line);padding-top:12px">Zerar apaga lançamentos, fixos e patrimônio e abre a configuração inicial de novo. Exporte um backup antes se quiser guardar.</p>` : ""}
    <div class="dlg-acts">${S.config ? `<button class="btn danger" type="button" data-del>Zerar tudo e começar de novo</button>` : ""}<button class="btn" type="button" data-cancel>Fechar</button></div>`, () => {}, async () => { dlg.close(); toast("Zerando…"); try { await Store.wipe(); } catch { toast("Não consegui zerar agora. Tente de novo."); return false; } UI.tab = "geral"; render(); toast("Tudo zerado. Vamos começar."); });
  $("#xExp").onclick = exportData;
  $("#xImp").onclick = () => $("#fileIn").click();
  $("#xConn")?.addEventListener("click", () => { dlg.close(); Drive.connect(); });
  $("#xDisc")?.addEventListener("click", () => { dlg.close(); Drive.disconnect(); toast("Drive desconectado. Os dados continuam neste aparelho."); });
  $("#xSync")?.addEventListener("click", () => { dlg.close(); (Drive.dirty ? Drive.push() : Drive.pull()).catch?.(e => Drive.onErr(e)); });
  $("#xCid")?.addEventListener("click", () => { dlg.close(); setTimeout(askClientId, 30); });
}

/* ───────── boot ───────── */
render();
if (window.claude && typeof window.claude.use === "function") Store.init();
else Store.initLocal();
})();
</script>
</body></html>
